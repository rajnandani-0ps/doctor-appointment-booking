# ===================================================================
# Doctor Appointment Booking Application Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------
# Database Configuration - H2 Database (Default Plug & Play)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:doctorappdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# Optional: MySQL Configuration (Uncomment to use MySQL instead of H2)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/doctor_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect # (For MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
app.jwt.secret=DoctorAppointmentSecureJWTSecretKeyForFullStackJavaSpringbootApplication2026!
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.doctorapp=INFO
logging.level.org.springframework.security=WARN
